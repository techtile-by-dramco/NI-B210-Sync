experiment: 51_t05_t08_coherent_combining
tiles: [T05, T06, T07, T08]

# T04 supplies the common reference, pilot, and scope-reference branches.
# Fill gain/attenuation only after measuring the complete distribution path.
rf_source_tile: T04
rf_source_device_args: type=b200
rf_source_tx_channel: 0
rf_source_tx_antenna: TX/RX
rf_source_tx_gain_db: null
rf_source_tone_amplitude: 0.2
rf_source_output_attenuation_db: null

center_frequency_hz: 920e6
tone_frequency_hz: 1e3
sample_rate_hz: 250e3
master_clock_rate_hz: 20e6
rf_bandwidth_hz: 200e3
clock_source: external
time_source: external

reference_channel: 0
measured_channel: 1
reference_rx_antenna: RX2
measured_rx_antenna: TX/RX
measured_tx_antenna: TX/RX
reference_rx_gain_db: 35
measured_rx_gain_db: 35
tx_gain_db: 50
tone_amplitude: 0.35
reference_input_power_dbm: null  # Measure at CH0 and fill in.
pilot_input_power_dbm: null      # Measure at CH1 and fill in.

capture_time_s: 2
transmit_time_s: 8
scope_delay_after_tx_start_s: 2
discard_time_s: 0.1
phase_block_samples: 4096
lock_timeout_s: 5
pps_settle_s: 2
command_lead_s: 0.25
stream_lead_s: 0.75
lo_settle_s: 0.1
loopback_fpga: ../30_mulit_usrp_sync_only_lb/client/usrp_b210_fpga_loopback.bin

control_host: 0.0.0.0
control_port: 55151
socket_timeout_s: 120
time_sync_tolerance_s: 0.25
repetitions: 10
individual_measurement_repetitions: 10
random_seed: 210

# phi_cable from the manuscript, measured relative to T05 at 920.001 MHz.
# Replace these placeholders and set reference_cable_phase_calibrated true.
reference_cable_phase_calibrated: false
reference_cable_phase_deg:
  T05: 0.0
  T06: 0.0
  T07: 0.0
  T08: 0.0

# Set this to the actual MSO64B VISA resource, or pass --manual-power.
scope_resource: null
scope_channel: CH1
scope_reference_channel: CH2
scope_rf_frequency_hz: 920.001e6
scope_points: 100000
scope_timeout_ms: 10000
combiner_output_attenuation_db: 20
